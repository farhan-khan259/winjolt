services:
  - type: web
    name: winjolt-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_URL
        value: https://winjolt-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
